<section aria-labelledby="contact-heading">

<h2 id="contact-heading">Contact Me</h2>

<form aria-label="Contact Form">

<div>
<label for="name">Full Name</label>
<br><br>

<input
type="text"
id="name"
name="name"
required
>
</div>

<br>

<div>
<label for="email">Email Address</label>
<br><br>

<input
type="email"
id="email"
name="email"
required
>
</div>

<br>

<div>
<label for="message">Message</label>
<br><br>

<textarea
id="message"
name="message"
rows="5"
required>
</textarea>
</div>

<br>

<button type="submit">
Send Message
</button>

</form>
